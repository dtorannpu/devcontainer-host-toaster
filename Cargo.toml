[package]
name = "toaster"
version = "0.1.0"
edition = "2024"

[dependencies]
notify-rust = "4.18.0"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["trace", "catch-panic"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
hidapi = "2.6.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
